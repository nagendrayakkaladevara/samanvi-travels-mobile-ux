const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
function tx(x,y,s,size=15,weight=400,color=C.ink,anchor='start',extra=''){return `<text x="${x}" y="${y}" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, sans-serif" font-size="${size}" font-weight="${weight}" fill="${color}" text-anchor="${anchor}" ${extra}>${esc(s)}</text>`;}
function lines(x,y,list,size=15,weight=400,color=C.muted,anchor='start',line=23){return list.map((s,i)=>tx(x,y+i*line,s,size,weight,color,anchor)).join('');}
function rect(x,y,w,h,r=16,fill=C.white,stroke='none',more=''){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}" stroke="${stroke}" ${more}/>`;}

const descriptions={2:['An uncomplicated start.','A quiet sign-in screen with clear labels, one primary action, and recovery within reach.'],31:['A welcome for every journey.','Home greets the driver and puts lunch, dinner and toilet announcements within easy reach.'],12:['Your route, stop by stop.','Announcements focuses on route audio. Quick break announcements live on Home.'],15:['One clear focus.','A dedicated player separates playback from route browsing, with prominent pause and immediate stop controls.'],25:['Everything in its place.','Grouped settings, understated dividers and familiar controls reduce the effort of finding what you need.'],27:['A considered empty state.','A simple message explains what is coming and makes clear that history is not recorded yet.']};
