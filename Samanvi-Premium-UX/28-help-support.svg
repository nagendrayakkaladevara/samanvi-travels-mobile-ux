<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" aria-label="Help &amp; support" role="group"><defs><filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1D1D1F" flood-opacity=".025"/></filter><filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1D1D1F" flood-opacity=".13"/></filter></defs><title>Help &amp; support</title><rect x="0" y="0" width="390" height="844" rx="0" fill="#F5F5F7" stroke="none" /><text x="26" y="28" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start" >9:41</text><path d="M304 25v-4m5 4v-7m5 7v-10" stroke="#1D1D1F" stroke-width="3"/><g transform="translate(326 14) scale(0.6666666666666666)" fill="none" stroke="#1D1D1F" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a16 16 0 0 1 18 0M6 12a10 10 0 0 1 12 0M9 16a4 4 0 0 1 6 0M12 20h.01"/></g><rect x="350" y="17" width="22" height="10" rx="3" fill="none" stroke="#1D1D1F" /><rect x="352" y="19" width="17" height="6" rx="1" fill="#1D1D1F" stroke="none" /><rect x="373" y="20" width="2" height="4" rx="1" fill="#1D1D1F" stroke="none" /><g><g transform="translate(21 64) scale(0.9166666666666666)" fill="none" stroke="#1D1D1F" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m14 5-7 7 7 7"/></g><rect x="12" y="50" width="52" height="48" fill="transparent" data-action="go:25" tabindex="0" role="button" aria-label="Go back" class="hit"/></g><text x="195" y="81" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="middle" >Help &amp; support</text><path d="M24 108H366" fill="none" stroke="#E7E7EB" stroke-width="1"/><text x="24" y="154" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#68686E" text-anchor="start" >WE’RE HERE TO HELP</text><text x="24" y="190" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, sans-serif" font-size="29" font-weight="650" fill="#1D1D1F" text-anchor="start" letter-spacing="-.65">Back on track.</text><rect x="24" y="216" width="342" height="110" rx="16" fill="#FFFFFF" stroke="#E7E7EB" /><text x="44" y="248" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start" >No sound from the speaker?</text><text x="44" y="274" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="400" fill="#68686E" text-anchor="start" >Check Bluetooth output and media volume.</text><text x="44" y="294" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="400" fill="#68686E" text-anchor="start" >Reconnect, then play a test announcement.</text><rect x="24" y="342" width="342" height="110" rx="16" fill="#FFFFFF" stroke="#E7E7EB" /><text x="44" y="374" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start" >Missing an announcement?</text><text x="44" y="400" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="400" fill="#68686E" text-anchor="start" >Open your audio library and identify the file.</text><text x="44" y="420" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="400" fill="#68686E" text-anchor="start" >Ask your administrator to restore it.</text><rect x="24" y="468" width="342" height="110" rx="16" fill="#FFFFFF" stroke="#E7E7EB" /><text x="44" y="500" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start" >Can I use the app offline?</text><text x="44" y="526" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="400" fill="#68686E" text-anchor="start" >Yes. Once signed in, saved routes and MP3s</text><text x="44" y="546" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="400" fill="#68686E" text-anchor="start" >work without an internet connection.</text><g><rect x="24" y="621" width="342" height="54" rx="14" fill="#FFFFFF" stroke="#E7E7EB" /><text x="195" y="654" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="middle" >Check speaker connection</text><rect x="24" y="621" width="342" height="54" fill="transparent" data-action="go:21" tabindex="0" role="button" aria-label="Check speaker connection" class="hit"/></g><text x="195" y="729" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="400" fill="#68686E" text-anchor="middle" >For account or route changes, contact</text><text x="195" y="749" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="400" fill="#68686E" text-anchor="middle" >your Samanvi Travels administrator.</text></svg>